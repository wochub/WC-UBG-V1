services:
  - type: web
    name: wc-ubg-games
    env: static
    buildCommand: echo "No build needed for static site"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /games/*
        name: Access-Control-Allow-Origin
        value: "*"
